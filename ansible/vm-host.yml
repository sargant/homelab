---
- name: Initialize Proxmox management host
  hosts: vm_host
  gather_facts: true

  pre_tasks:
    - name: Check operating system
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Debian"
          - ansible_facts.distribution_major_version == "13"
        fail_msg: >-
          Expected Debian 13, found
          {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.

    - name: Check Proxmox VE
      ansible.builtin.command:
        argv:
          - pveversion
      changed_when: false

  tasks:
    - name: Install management tool prerequisites
      ansible.builtin.apt:
        name:
          - ansible-core
          - ca-certificates
          - curl
          - gnupg
          - just
          - openssh-client
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Install OpenTofu signing key
      ansible.builtin.get_url:
        url: https://get.opentofu.org/opentofu.gpg
        dest: /etc/apt/keyrings/opentofu.gpg
        mode: "0644"

    - name: Download OpenTofu repository signing key
      ansible.builtin.get_url:
        url: https://packages.opentofu.org/opentofu/tofu/gpgkey
        dest: /etc/apt/keyrings/opentofu-repo.asc
        mode: "0644"
      register: opentofu_repo_key

    - name: Check OpenTofu repository keyring
      ansible.builtin.stat:
        path: /etc/apt/keyrings/opentofu-repo.gpg
      register: opentofu_repo_keyring

    - name: Build OpenTofu repository keyring
      ansible.builtin.command:
        argv:
          - gpg
          - --batch
          - --yes
          - --dearmor
          - --output
          - /etc/apt/keyrings/opentofu-repo.gpg
          - /etc/apt/keyrings/opentofu-repo.asc
      when: opentofu_repo_key.changed or not opentofu_repo_keyring.stat.exists

    - name: Configure OpenTofu apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/opentofu.list
        mode: "0644"
        content: |
          deb [signed-by=/etc/apt/keyrings/opentofu.gpg,/etc/apt/keyrings/opentofu-repo.gpg] https://packages.opentofu.org/opentofu/tofu/any/ any main
          deb-src [signed-by=/etc/apt/keyrings/opentofu.gpg,/etc/apt/keyrings/opentofu-repo.gpg] https://packages.opentofu.org/opentofu/tofu/any/ any main

    - name: Install OpenTofu
      ansible.builtin.apt:
        name: tofu
        state: present
        update_cache: true

    - name: Create root SSH directory
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        mode: "0700"

    - name: Check VM management private key
      ansible.builtin.stat:
        path: /root/.ssh/vm-management
      register: vm_management_private_key

    - name: Check VM management public key
      ansible.builtin.stat:
        path: /root/.ssh/vm-management.pub
      register: vm_management_public_key

    - name: Reject incomplete VM management keypair
      ansible.builtin.assert:
        that:
          - vm_management_private_key.stat.exists == vm_management_public_key.stat.exists
        fail_msg: >-
          Expected both /root/.ssh/vm-management and /root/.ssh/vm-management.pub,
          or neither. Refusing to repair an incomplete keypair.

    - name: Create VM management SSH keypair
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ""
          - -C
          - vm-management@vm-host
          - -f
          - /root/.ssh/vm-management
      when: not vm_management_private_key.stat.exists

    - name: Set VM management private key permissions
      ansible.builtin.file:
        path: /root/.ssh/vm-management
        mode: "0600"

    - name: Set VM management public key permissions
      ansible.builtin.file:
        path: /root/.ssh/vm-management.pub
        mode: "0644"

    - name: Authorize VM management key for local root SSH
      ansible.builtin.lineinfile:
        path: /root/.ssh/authorized_keys
        line: "{{ lookup('ansible.builtin.file', '/root/.ssh/vm-management.pub') }}"
        create: true
        mode: "0600"

    - name: Configure interactive shell
      ansible.builtin.import_tasks: tasks/configure-shell.yml

    - name: Verify OpenTofu
      ansible.builtin.command:
        argv:
          - tofu
          - version
      changed_when: false

    - name: Verify Just
      ansible.builtin.command:
        argv:
          - just
          - --version
      changed_when: false

    - name: Verify VM management SSH key
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -l
          - -f
          - /root/.ssh/vm-management.pub
      changed_when: false
