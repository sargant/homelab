---
- name: Configure Brother HL-1212W AirPrint bridge
  hosts: print_server
  gather_facts: false

  vars:
    printer_host: printer.home.arpa
    printer_queue: Brother_HL_1212W
    printer_name: Brother HL-1212W
    printer_driver_model: drv:///brlaser.drv/br1200.ppd
    printer_device_uri: "socket://{{ printer_host }}:9100"
    printer_ppd: "/etc/cups/ppd/{{ printer_queue }}.ppd"
    brlaser_filter: /usr/lib/cups/filter/rastertobrlaser
    supply_wrapper: /usr/lib/cups/filter/rastertobrlaser-with-supplies

    toner_oid: "1.3.6.1.4.1.1240.2.3.4.6.4.0"
    drum_max_oid: "1.3.6.1.2.1.43.11.1.1.8.1.2"
    drum_level_oid: "1.3.6.1.2.1.43.11.1.1.9.1.2"

  pre_tasks:
    - name: Trust SSH host key
      ansible.builtin.include_tasks: "{{ common_dir }}/trust-host.yml"

    - name: Bootstrap Debian
      ansible.builtin.include_tasks: "{{ common_dir }}/bootstrap-debian.yml"

  tasks:
    - name: Install print server packages
      ansible.builtin.apt:
        name:
          - cups
          - avahi-daemon
          - avahi-utils
          - printer-driver-brlaser
          - snmp
        state: present
        install_recommends: false
        update_cache: true
        cache_valid_time: 3600

    - name: Enable print services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - cups
        - avahi-daemon

    - name: Check raw printer port
      ansible.builtin.wait_for:
        host: "{{ printer_host }}"
        port: 9100
        timeout: 3

    - name: Configure CUPS
      ansible.builtin.command:
        argv:
          - cupsctl
          - --remote-any
          - --share-printers
          - --no-debug-logging
          - "ServerAlias={{ ansible_host }}"
      changed_when: false

    - name: Install supply-level wrapper
      ansible.builtin.template:
        src: "{{ playbook_dir }}/rastertobrlaser-with-supplies.j2"
        dest: "{{ supply_wrapper }}"
        mode: "0755"
      notify: Restart CUPS

    - name: Configure printer queue and PPD
      ansible.builtin.shell: |
        set -euo pipefail
        changed=0

        printer_exists() {
          lpstat -p 2>/dev/null | awk '{print $2}' | grep -Fxq "$1"
        }

        stale="{{ printer_queue }}_print_server"
        if printer_exists "$stale"; then
          lpadmin -x "$stale"
          changed=1
        fi

        if ! printer_exists "{{ printer_queue }}"; then
          lpadmin \
            -p "{{ printer_queue }}" \
            -E \
            -D "{{ printer_name }}" \
            -L "print-server" \
            -v "{{ printer_device_uri }}" \
            -m "{{ printer_driver_model }}"
          changed=1
        fi

        current_uri="$(lpstat -v "{{ printer_queue }}" | sed 's/.*: //')"
        if [ "$current_uri" != "{{ printer_device_uri }}" ]; then
          lpadmin -p "{{ printer_queue }}" -v "{{ printer_device_uri }}"
          changed=1
        fi

        lpadmin -p "{{ printer_queue }}" -D "{{ printer_name }}" -L "print-server"
        lpadmin -p "{{ printer_queue }}" -o cupsSNMPSupplies=false
        lpadmin -d "{{ printer_queue }}"
        cupsaccept "{{ printer_queue }}"
        cupsenable "{{ printer_queue }}"

        ppd="{{ printer_ppd }}"
        [ -f "$ppd" ]

        if ! grep -q 'rastertobrlaser-with-supplies' "$ppd"; then
          grep -q 'rastertobrlaser"' "$ppd"
          sed -i \
            's#\*cupsFilter: "application/vnd.cups-raster 33 rastertobrlaser"#*cupsFilter: "application/vnd.cups-raster 33 rastertobrlaser-with-supplies"#' \
            "$ppd"
          changed=1
        fi

        if grep -q '^\*cupsSNMPSupplies:' "$ppd"; then
          if ! grep -q '^\*cupsSNMPSupplies: False$' "$ppd"; then
            sed -i 's/^\*cupsSNMPSupplies:.*/\*cupsSNMPSupplies: False/' "$ppd"
            changed=1
          fi
        else
          printf '*cupsSNMPSupplies: False\n' >> "$ppd"
          changed=1
        fi

        if ! grep -q '^\*NickName: "Brother HL-1200 series via CUPS"$' "$ppd"; then
          sed -i \
            's#^\*NickName: ".*"#*NickName: "Brother HL-1200 series via CUPS"#' \
            "$ppd"
          changed=1
        fi

        [ "$changed" -eq 0 ] || echo __ANSIBLE_CHANGED__
      args:
        executable: /bin/bash
      register: printer_configuration
      changed_when: "'__ANSIBLE_CHANGED__' in printer_configuration.stdout"
      notify: Restart CUPS

    - name: Apply CUPS changes before verification
      ansible.builtin.meta: flush_handlers

    - name: Verify print server without printing
      ansible.builtin.shell: |
        set -euo pipefail

        systemctl is-active --quiet cups
        systemctl is-active --quiet avahi-daemon

        device_uri="$(lpstat -v "{{ printer_queue }}" | sed 's/.*: //')"
        [ "$device_uri" = "{{ printer_device_uri }}" ]

        grep -q 'rastertobrlaser-with-supplies' "{{ printer_ppd }}"
        grep -q '^\*cupsSNMPSupplies: False$' "{{ printer_ppd }}"
        grep -q '^\*NickName: "Brother HL-1200 series via CUPS"$' "{{ printer_ppd }}"

        wrapper_output="$(
          {
            printf '' |
              "{{ supply_wrapper }}" 1 root supply-check 1 '' 2>&1 ||
              true
          } | head -n 6
        )"

        marker_levels="$(grep -E '^ATTR: marker-levels=[0-9]+,[0-9]+$' <<<"$wrapper_output")"
        levels="${marker_levels#ATTR: marker-levels=}"
        toner="${levels%,*}"
        drum="${levels#*,}"

        printf 'Backend: %s\n' "$device_uri"
        printf 'Toner: %s%%\n' "$toner"
        printf 'Drum: %s%%\n' "$drum"
      args:
        executable: /bin/bash
      register: verification
      changed_when: false

    - name: Wait for AirPrint advertisements
      ansible.builtin.shell: |
        set -euo pipefail
        service="{{ printer_name }} @ {{ system_hostname }}"

        ipp_services="$(
          timeout 2s avahi-browse -t _ipp._tcp 2>/dev/null || true
        )"
        universal_services="$(
          timeout 2s avahi-browse -t _universal._sub._ipp._tcp 2>/dev/null || true
        )"

        grep -Fq "$service" <<<"$ipp_services"
        grep -Fq "$service" <<<"$universal_services"

        echo "IPP/AirPrint advertisement: found"
        echo "Universal AirPrint subtype: found"
      args:
        executable: /bin/bash
      register: airprint_status
      changed_when: false
      retries: 10
      delay: 2
      until: airprint_status.rc == 0

    - name: Report print server status
      ansible.builtin.debug:
        msg:
          - "{{ verification.stdout_lines }}"
          - "{{ airprint_status.stdout_lines }}"

  handlers:
    - name: Restart CUPS
      ansible.builtin.systemd_service:
        name: cups
        state: restarted
