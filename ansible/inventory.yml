all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: /root/.ssh/vm-management
    ansible_python_interpreter: /usr/bin/python3
    github_ssh_user: sargant

  hosts:
    vm_host:
      ansible_host: localhost
      ansible_connection: local

    tailscale:
      ansible_host: tailscale.home.arpa
      system_hostname: tailscale
      proxmox_ctid: 1021

    print_server:
      ansible_host: print-server.home.arpa
      system_hostname: print-server
      proxmox_ctid: 1041
