---
- name: Check Proxmox guest identifier
  ansible.builtin.assert:
    that:
      - (proxmox_ctid is defined) or (proxmox_vmid is defined)
      - not ((proxmox_ctid is defined) and (proxmox_vmid is defined))
    fail_msg: >-
      Expected exactly one of proxmox_ctid or proxmox_vmid for
      {{ inventory_hostname }}.

- name: Read target SSH host keys from Proxmox LXC
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ proxmox_ctid | string }}"
      - --
      - sh
      - -c
      - "awk '{print $1, $2}' /etc/ssh/ssh_host_*_key.pub | sort -u"
  delegate_to: localhost
  register: target_lxc_ssh_host_keys
  changed_when: false
  retries: 10
  delay: 1
  until:
    - target_lxc_ssh_host_keys.rc == 0
    - target_lxc_ssh_host_keys.stdout | trim | length > 0
  when: proxmox_ctid is defined

- name: Read target SSH host keys from Proxmox VM
  ansible.builtin.command:
    argv:
      - qm
      - guest
      - exec
      - "{{ proxmox_vmid | string }}"
      - --
      - sh
      - -c
      - "awk '{print $1, $2}' /etc/ssh/ssh_host_*_key.pub | sort -u"
  delegate_to: localhost
  register: target_vm_ssh_host_keys
  changed_when: false
  retries: 30
  delay: 2
  until: >-
    target_vm_ssh_host_keys.rc == 0
    and (target_vm_ssh_host_keys.stdout | trim | length > 0)
    and ((target_vm_ssh_host_keys.stdout | from_json).exited | default(0)) == 1
    and ((target_vm_ssh_host_keys.stdout | from_json).exitcode | default(1)) == 0
    and (((target_vm_ssh_host_keys.stdout | from_json)['out-data'] | default('') | trim | length) > 0)
  when: proxmox_vmid is defined

- name: Normalize target SSH host keys
  ansible.builtin.set_fact:
    target_ssh_host_key_material: >-
      {{
        target_lxc_ssh_host_keys.stdout_lines
        if proxmox_ctid is defined
        else (
          (target_vm_ssh_host_keys.stdout | from_json)['out-data']
          | trim
        ).split('\n')
      }}

- name: Read currently trusted SSH host keys
  ansible.builtin.shell: |
    ssh-keygen -F "{{ hostvars[inventory_hostname].ansible_host }}" \
      -f /root/.ssh/known_hosts 2>/dev/null |
      awk '!/^#/ {print $2, $3}' |
      sort -u
  args:
    executable: /bin/bash
  delegate_to: localhost
  register: trusted_ssh_host_keys
  changed_when: false

- name: Compare trusted SSH host keys
  ansible.builtin.set_fact:
    trusted_ssh_host_key_material: "{{ trusted_ssh_host_keys.stdout_lines }}"

- name: Remove stale SSH host keys
  ansible.builtin.known_hosts:
    path: /root/.ssh/known_hosts
    name: "{{ hostvars[inventory_hostname].ansible_host }}"
    state: absent
  delegate_to: localhost
  when: trusted_ssh_host_key_material != target_ssh_host_key_material

- name: Trust current SSH host keys
  ansible.builtin.known_hosts:
    path: /root/.ssh/known_hosts
    name: "{{ hostvars[inventory_hostname].ansible_host }}"
    key: >-
      {{ hostvars[inventory_hostname].ansible_host }}
      {{ item }}
    hash_host: true
    state: present
  delegate_to: localhost
  loop: "{{ target_ssh_host_key_material }}"
  loop_control:
    label: "{{ item.split()[0] }}"
  when: trusted_ssh_host_key_material != target_ssh_host_key_material
