---
- name: Install BorgBackup
  ansible.builtin.apt:
    name: borgbackup
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure Paperless export service
  ansible.builtin.copy:
    dest: /etc/systemd/system/paperless-export.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Paperless document export
      Requires=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      WorkingDirectory={{ paperless_install_path }}
      ExecStart=/usr/bin/docker compose exec -T webserver document_exporter /usr/src/paperless/export --delete
  register: paperless_export_service

- name: Configure Paperless export timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/paperless-export.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Daily Paperless document export

      [Timer]
      OnCalendar=*-*-* 03:00:00
      Persistent=true
      RandomizedDelaySec=10m
      Unit=paperless-export.service

      [Install]
      WantedBy=timers.target
  register: paperless_export_timer

- name: Enable Paperless export timer
  ansible.builtin.systemd_service:
    name: paperless-export.timer
    enabled: true
    daemon_reload: "{{ paperless_export_service.changed or paperless_export_timer.changed }}"
    state: "{{ 'restarted' if paperless_export_timer.changed else 'started' }}"
