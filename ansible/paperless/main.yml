---
- name: Configure Paperless host
  hosts: paperless
  gather_facts: false

  vars:
    paperless_version: 3.1.3
    paperless_install_path: /opt/paperless
    paperless_backup_mountpoint: /mnt/backup
    paperless_borg_repository: "{{ paperless_backup_mountpoint }}/borg"
    paperless_secret_key_path: "{{ paperless_install_path }}/secrets/paperless_secret_key"
    paperless_restore_marker_path: "{{ paperless_install_path }}/.restore-pending"

  pre_tasks:
    - name: Trust SSH host key
      ansible.builtin.include_tasks: "{{ common_dir }}/trust-host.yml"

    - name: Bootstrap Debian
      ansible.builtin.include_tasks: "{{ common_dir }}/bootstrap-debian.yml"

  tasks:
    - name: Configure Paperless backup infrastructure
      block:
        - name: Configure Paperless backup NFS mount
          ansible.builtin.include_tasks: "{{ common_dir }}/configure-nfs-mount.yml"
          vars:
            nfs_source: "{{ hostvars['nas'].ansible_host }}:/volume1/backup/paperless"
            nfs_mountpoint: "{{ paperless_backup_mountpoint }}"

        - name: Configure Paperless Borg backup
          ansible.builtin.include_tasks: "{{ common_dir }}/configure-borg-backup.yml"
          vars:
            borg_service_name: paperless-borg
            borg_repository: "{{ paperless_borg_repository }}"
            borg_source: "{{ paperless_install_path }}/export"

    - name: Configure Paperless host
      block:
        - name: Install Docker
          ansible.builtin.include_tasks: "{{ common_dir }}/install-docker.yml"

        - name: Check for existing Paperless database
          ansible.builtin.command:
            argv:
              - docker
              - volume
              - inspect
              - paperless_pgdata
          register: paperless_database_volume
          changed_when: false
          failed_when: paperless_database_volume.rc not in [0, 1]

        - name: Check for pending Paperless restore
          ansible.builtin.stat:
            path: "{{ paperless_restore_marker_path }}"
          register: paperless_restore_marker

        - name: Set Paperless memory overcommit
          ansible.posix.sysctl:
            name: vm.overcommit_memory
            value: "1"
            state: present
            sysctl_set: true
            reload: true
            sysctl_file: /etc/sysctl.d/99-paperless.conf

        - name: Create Paperless consume directory
          ansible.builtin.file:
            path: "{{ paperless_install_path }}/consume"
            state: directory
            owner: "1000"
            group: "1000"
            mode: "0777"

        - name: Create Paperless export directory
          ansible.builtin.file:
            path: "{{ paperless_install_path }}/export"
            state: directory
            owner: "1000"
            group: "1000"
            mode: "0755"

        - name: Create Paperless secrets directory
          ansible.builtin.file:
            path: "{{ paperless_secret_key_path | dirname }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Generate Paperless secret key
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - >-
                import secrets, pathlib;
                pathlib.Path({{ paperless_secret_key_path | to_json }}).write_text(secrets.token_hex(32))
            creates: "{{ paperless_secret_key_path }}"

        - name: Read Paperless secret key metadata
          ansible.builtin.stat:
            path: "{{ paperless_secret_key_path }}"
          register: paperless_secret_key_file

        - name: Check Paperless secret key
          ansible.builtin.assert:
            that:
              - paperless_secret_key_file.stat.exists
              - paperless_secret_key_file.stat.size == 64
            fail_msg: Paperless secret key is missing or invalid.

        - name: Secure Paperless secret key
          ansible.builtin.file:
            path: "{{ paperless_secret_key_path }}"
            state: file
            owner: root
            group: root
            mode: "0600"

        - name: Configure Paperless Samba inbox
          ansible.builtin.include_tasks: "{{ common_dir }}/configure-samba-host.yml"
          vars:
            samba_config_source: "{{ playbook_dir }}/smb.conf.j2"

    - name: Prepare Paperless restore
      when: paperless_database_volume.rc != 0 or paperless_restore_marker.stat.exists
      block:
        - name: Read pending Paperless restore archive
          ansible.builtin.slurp:
            src: "{{ paperless_restore_marker_path }}"
          register: paperless_restore_marker_content
          when: paperless_restore_marker.stat.exists

        - name: Select pending Paperless restore archive
          ansible.builtin.set_fact:
            paperless_restore_archive: "{{ paperless_restore_marker_content.content | b64decode | trim }}"
          when: paperless_restore_marker.stat.exists

        - name: Find latest Paperless backup
          ansible.builtin.command:
            argv:
              - borg
              - list
              - --last
              - "1"
              - --format
              - "{archive}{NL}"
              - "{{ paperless_borg_repository }}"
          register: paperless_backup_list
          changed_when: false
          when: not paperless_restore_marker.stat.exists
          environment:
            BORG_UNKNOWN_UNENCRYPTED_REPO_ACCESS_IS_OK: "yes"

        - name: Select latest Paperless restore archive
          ansible.builtin.set_fact:
            paperless_restore_archive: "{{ paperless_backup_list.stdout | trim }}"
          when: not paperless_restore_marker.stat.exists

        - name: Check pending Paperless restore archive
          ansible.builtin.assert:
            that:
              - paperless_restore_archive | length > 0
            fail_msg: Pending Paperless restore does not contain an archive name.
          when: paperless_restore_marker.stat.exists

        - name: Record pending Paperless restore
          ansible.builtin.copy:
            dest: "{{ paperless_restore_marker_path }}"
            content: "{{ paperless_restore_archive }}\n"
            owner: root
            group: root
            mode: "0600"
          when:
            - not paperless_restore_marker.stat.exists
            - paperless_restore_archive | length > 0

        - name: Reset incomplete Paperless restore
          community.docker.docker_compose_v2:
            project_src: "{{ paperless_install_path }}"
            state: absent
            remove_volumes: true
          when:
            - paperless_restore_marker.stat.exists
            - paperless_database_volume.rc == 0

        - name: Clear Paperless export directory before restore
          ansible.builtin.file:
            path: "{{ paperless_install_path }}/export"
            state: absent
          when: paperless_restore_archive | length > 0

        - name: Restore latest Paperless export
          ansible.builtin.command:
            argv:
              - borg
              - extract
              - "{{ paperless_borg_repository }}::{{ paperless_restore_archive }}"
              - export
            chdir: "{{ paperless_install_path }}"
          when: paperless_restore_archive | length > 0
          environment:
            BORG_UNKNOWN_UNENCRYPTED_REPO_ACCESS_IS_OK: "yes"

    - name: Configure Paperless application
      block:
        - name: Configure Paperless Docker Compose services
          ansible.builtin.include_tasks: "{{ common_dir }}/configure-docker-compose.yml"
          vars:
            compose_source: "{{ playbook_dir }}/compose.yml"
            compose_path: "{{ paperless_install_path }}"
            compose_expected_services:
              - broker
              - db
              - webserver

        - name: Wait for Paperless HTTP response
          ansible.builtin.uri:
            url: http://127.0.0.1/
            method: GET
            follow_redirects: none
            status_code:
              - 200
              - 302
          register: paperless_http_check
          retries: 12
          delay: 5
          until: paperless_http_check.status in [200, 302]

        - name: Import restored Paperless backup
          community.docker.docker_compose_v2_exec:
            project_src: "{{ paperless_install_path }}"
            service: webserver
            argv:
              - document_importer
              - /usr/src/paperless/export
            tty: false
          when: paperless_restore_archive | default('') | length > 0

        - name: Mark Paperless restore complete
          ansible.builtin.file:
            path: "{{ paperless_restore_marker_path }}"
            state: absent
          when: paperless_restore_archive | default('') | length > 0

    - name: Configure Paperless scheduled backups
      block:
        - name: Configure Paperless export service
          ansible.builtin.template:
            src: "{{ playbook_dir }}/paperless-export.service.j2"
            dest: /etc/systemd/system/paperless-export.service
            mode: "0644"
          register: paperless_export_service

        - name: Configure Paperless export timer
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/paperless-export.timer"
            dest: /etc/systemd/system/paperless-export.timer
            mode: "0644"
          register: paperless_export_timer

        - name: Enable Paperless export timer
          ansible.builtin.systemd_service:
            name: paperless-export.timer
            enabled: true
            daemon_reload: "{{ paperless_export_service.changed or paperless_export_timer.changed }}"
            state: "{{ 'restarted' if paperless_export_timer.changed else 'started' }}"
