---
- name: Configure Paperless host
  hosts: paperless
  gather_facts: false

  vars:
    paperless_backup_source: "{{ hostvars['nas'].ansible_host }}:/volume1/backup/paperless"
    paperless_backup_mount: /mnt/backup
    paperless_install_path: /opt/paperless
    paperless_consume_path: "{{ paperless_install_path }}/consume"
    paperless_export_path: "{{ paperless_install_path }}/export"
    paperless_secrets_path: "{{ paperless_install_path }}/secrets"
    paperless_secret_key_path: "{{ paperless_secrets_path }}/paperless_secret_key"

  pre_tasks:
    - name: Trust SSH host key
      ansible.builtin.import_tasks: "{{ common_dir }}/trust-host.yml"

    - name: Bootstrap Debian
      ansible.builtin.import_tasks: "{{ common_dir }}/bootstrap-debian.yml"

  tasks:
    - name: Install Docker
      ansible.builtin.import_tasks: "{{ common_dir }}/install-docker.yml"

    - name: Configure Paperless backup NFS mount
      ansible.builtin.import_tasks: "{{ common_dir }}/configure-nfs-mount.yml"
      vars:
        nfs_source: "{{ paperless_backup_source }}"
        nfs_mountpoint: "{{ paperless_backup_mount }}"

    - name: Configure Paperless kernel settings
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-paperless.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          vm.overcommit_memory = 1

    - name: Read memory overcommit setting
      ansible.builtin.command:
        argv:
          - sysctl
          - -n
          - vm.overcommit_memory
      register: paperless_overcommit_memory
      changed_when: false

    - name: Apply memory overcommit setting
      ansible.builtin.command:
        argv:
          - sysctl
          - -w
          - vm.overcommit_memory=1
      when: paperless_overcommit_memory.stdout | trim != '1'
      changed_when: true

    - name: Verify memory overcommit setting
      ansible.builtin.command:
        argv:
          - sysctl
          - -n
          - vm.overcommit_memory
      register: paperless_overcommit_memory_check
      changed_when: false

    - name: Check memory overcommit setting
      ansible.builtin.assert:
        that:
          - paperless_overcommit_memory_check.stdout | trim == '1'
        fail_msg: vm.overcommit_memory is not set to 1.

    - name: Install Paperless host packages
      ansible.builtin.apt:
        name:
          - samba
        state: present

    - name: Create Paperless consume directory
      ansible.builtin.file:
        path: "{{ paperless_consume_path }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0777"

    - name: Create Paperless export directory
      ansible.builtin.file:
        path: "{{ paperless_export_path }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"

    - name: Create Paperless secrets directory
      ansible.builtin.file:
        path: "{{ paperless_secrets_path }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Generate Paperless secret key
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import secrets, pathlib;
            pathlib.Path({{ paperless_secret_key_path | to_json }}).write_text(secrets.token_hex(32))
        creates: "{{ paperless_secret_key_path }}"

    - name: Read Paperless secret key metadata
      ansible.builtin.stat:
        path: "{{ paperless_secret_key_path }}"
      register: paperless_secret_key_file

    - name: Check Paperless secret key
      ansible.builtin.assert:
        that:
          - paperless_secret_key_file.stat.exists
          - paperless_secret_key_file.stat.size == 64
        fail_msg: Paperless secret key is missing or invalid.

    - name: Secure Paperless secret key
      ansible.builtin.file:
        path: "{{ paperless_secret_key_path }}"
        state: file
        owner: root
        group: root
        mode: "0600"

    - name: Configure Paperless Samba inbox
      ansible.builtin.template:
        src: smb.conf.j2
        dest: /etc/samba/smb.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart Samba

    - name: Validate Samba configuration
      ansible.builtin.command:
        argv:
          - testparm
          - -s
      register: paperless_samba_config_check
      changed_when: false

    - name: Enable and start Samba
      ansible.builtin.service:
        name: smbd
        enabled: true
        state: started

    - name: Apply Samba configuration
      ansible.builtin.meta: flush_handlers

    - name: Verify Samba is running
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - smbd
      register: paperless_samba_service_check
      changed_when: false

    - name: Check Samba service
      ansible.builtin.assert:
        that:
          - paperless_samba_service_check.stdout | trim == 'active'
        fail_msg: Samba is not active.

    - name: Install Paperless Compose definition
      ansible.builtin.copy:
        src: compose.yml
        dest: "{{ paperless_install_path }}/compose.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Validate Paperless Compose definition
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - config
          - --quiet
      args:
        chdir: "{{ paperless_install_path }}"
      changed_when: false

    - name: Pull Paperless images
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - pull
      args:
        chdir: "{{ paperless_install_path }}"
      changed_when: false

    - name: Start Paperless
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - up
          - -d
      args:
        chdir: "{{ paperless_install_path }}"
      register: paperless_compose_up
      changed_when: >-
        'Created' in paperless_compose_up.stdout or
        'Created' in paperless_compose_up.stderr or
        'Recreated' in paperless_compose_up.stdout or
        'Recreated' in paperless_compose_up.stderr or
        'Started' in paperless_compose_up.stdout or
        'Started' in paperless_compose_up.stderr

    - name: Read running Paperless services
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - ps
          - --status
          - running
          - --services
      args:
        chdir: "{{ paperless_install_path }}"
      register: paperless_running_services
      changed_when: false

    - name: Check Paperless services
      ansible.builtin.assert:
        that:
          - paperless_running_services.stdout_lines | sort == ['broker', 'db', 'webserver'] | sort
        fail_msg: >-
          Expected broker, db, and webserver to be running; found
          {{ paperless_running_services.stdout_lines | join(', ') }}.

    - name: Wait for Paperless HTTP response
      ansible.builtin.uri:
        url: http://127.0.0.1/
        method: GET
        follow_redirects: none
        status_code:
          - 200
          - 302
      register: paperless_http_check
      retries: 30
      delay: 2
      until: paperless_http_check.status in [200, 302]

  handlers:
    - name: Restart Samba
      ansible.builtin.service:
        name: smbd
        state: restarted
