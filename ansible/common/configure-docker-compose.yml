---
- name: Check Docker Compose configuration
  ansible.builtin.assert:
    that:
      - compose_path is defined
      - compose_path | trim | length > 0
      - compose_expected_services is defined
      - compose_expected_services | length > 0
    fail_msg: compose_path and compose_expected_services must be defined.

- name: Configure Docker Compose services
  community.docker.docker_compose_v2:
    project_src: "{{ compose_path }}"
    state: present
    pull: always
  register: compose_result

- name: Check Docker Compose services
  ansible.builtin.assert:
    that:
      - compose_running_services | sort == compose_expected_services | sort
    fail_msg: >-
      Expected {{ compose_expected_services | join(', ') }} to be running; found
      {{ compose_running_services | join(', ') }}.
  vars:
    compose_running_services: >-
      {{
        compose_result.containers
        | selectattr('State', 'equalto', 'running')
        | map(attribute='Service')
        | unique
        | list
      }}
