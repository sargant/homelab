---
- name: Read pending Borg restore archive
  ansible.builtin.command:
    argv:
      - cat
      - "{{ borg_restore_marker_path }}"
  register: borg_restore_marker
  changed_when: false
  failed_when: false

- name: Use pending Borg restore archive
  ansible.builtin.set_fact:
    borg_restore_archive: "{{ borg_restore_marker.stdout | trim }}"
  when: borg_restore_marker.stdout | trim | length > 0

- name: Find latest Borg backup
  ansible.builtin.command:
    argv:
      - borg
      - list
      - --last
      - "1"
      - --format
      - "{archive}{NL}"
      - "{{ borg_restore_repository }}"
  register: borg_restore_list
  changed_when: false
  when: borg_restore_archive | default('') | length == 0
  environment:
    BORG_UNKNOWN_UNENCRYPTED_REPO_ACCESS_IS_OK: "yes"

- name: Use latest Borg backup
  ansible.builtin.set_fact:
    borg_restore_archive: "{{ borg_restore_list.stdout | trim }}"
  when: borg_restore_list is not skipped

- name: Record pending Borg restore
  ansible.builtin.copy:
    dest: "{{ borg_restore_marker_path }}"
    content: "{{ borg_restore_archive }}\n"
    owner: root
    group: root
    mode: "0600"
  when: borg_restore_archive | length > 0
