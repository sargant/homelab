---
- name: Find latest Borg backup
  ansible.builtin.command:
    argv:
      - borg
      - list
      - --last
      - "1"
      - --format
      - "{archive}{NL}"
      - "{{ borg_restore_repository }}"
  register: borg_restore_list
  changed_when: false
  environment:
    BORG_UNKNOWN_UNENCRYPTED_REPO_ACCESS_IS_OK: "yes"

- name: Select latest Borg restore archive
  ansible.builtin.set_fact:
    borg_restore_archive: "{{ borg_restore_list.stdout | trim }}"

- name: Record pending Borg restore
  ansible.builtin.copy:
    dest: "{{ borg_restore_marker_path }}"
    content: ""
    owner: root
    group: root
    mode: "0600"
  when: borg_restore_archive | length > 0
