---
- name: Check NFS mount configuration
  ansible.builtin.assert:
    that:
      - nfs_source is defined
      - nfs_source | trim | length > 0
      - nfs_mountpoint is defined
      - nfs_mountpoint | trim | length > 0
    fail_msg: nfs_source and nfs_mountpoint must be defined.

- name: Install NFS client
  ansible.builtin.apt:
    name: nfs-common
    state: present

- name: Mount NFS storage
  ansible.posix.mount:
    src: "{{ nfs_source }}"
    path: "{{ nfs_mountpoint }}"
    fstype: nfs4
    opts: "{{ nfs_mount_options | default('defaults,_netdev') }}"
    state: mounted

- name: Verify NFS read/write access
  block:
    - name: Create unique NFS mount probe
      ansible.builtin.tempfile:
        state: file
        path: "{{ nfs_mountpoint }}"
        prefix: .ansible-nfs-write-test-
      register: nfs_mount_probe_file
      changed_when: false

    - name: Write NFS mount probe
      ansible.builtin.copy:
        dest: "{{ nfs_mount_probe_file.path }}"
        content: "ansible nfs mount test\n"
        mode: "0600"
      changed_when: false

    - name: Read NFS mount probe
      ansible.builtin.slurp:
        src: "{{ nfs_mount_probe_file.path }}"
      register: nfs_mount_probe

    - name: Check NFS mount probe
      ansible.builtin.assert:
        that:
          - (nfs_mount_probe.content | b64decode) == 'ansible nfs mount test\n'
        fail_msg: NFS read/write probe failed for {{ nfs_mountpoint }}.
  always:
    - name: Remove NFS mount probe
      ansible.builtin.file:
        path: "{{ nfs_mount_probe_file.path }}"
        state: absent
      when: nfs_mount_probe_file is defined and nfs_mount_probe_file.path is defined
      changed_when: false
