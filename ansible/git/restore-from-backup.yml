---
- name: Read pending Gogs restore archive
  ansible.builtin.slurp:
    src: "{{ gogs_restore_marker_path }}"
  register: gogs_restore_marker_content
  when: gogs_restore_marker.stat.exists

- name: Select pending Gogs restore archive
  ansible.builtin.set_fact:
    gogs_restore_archive: "{{ gogs_restore_marker_content.content | b64decode | trim }}"
  when: gogs_restore_marker.stat.exists

- name: Check pending Gogs restore archive
  ansible.builtin.assert:
    that:
      - gogs_restore_archive | length > 0
    fail_msg: Pending Gogs restore does not contain an archive name.
  when: gogs_restore_marker.stat.exists

- name: Find latest Gogs backup
  ansible.builtin.command:
    argv:
      - borg
      - list
      - --last
      - "1"
      - --format
      - "{archive}{NL}"
      - "{{ gogs_borg_repository }}"
  register: gogs_backup_list
  changed_when: false
  when: not gogs_restore_marker.stat.exists
  environment:
    BORG_UNKNOWN_UNENCRYPTED_REPO_ACCESS_IS_OK: "yes"

- name: Select latest Gogs restore archive
  ansible.builtin.set_fact:
    gogs_restore_archive: "{{ gogs_backup_list.stdout | trim }}"
  when: not gogs_restore_marker.stat.exists

- name: Restore Gogs backup
  when: gogs_restore_archive | default('') | length > 0
  block:
    - name: Record pending Gogs restore
      ansible.builtin.copy:
        dest: "{{ gogs_restore_marker_path }}"
        content: "{{ gogs_restore_archive }}\n"
        owner: root
        group: root
        mode: "0600"

    - name: Clear Gogs state before restore
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ gogs_install_path }}/data"
        - "{{ gogs_install_path }}/custom"
        - "{{ gogs_install_path }}/custom.bak"
        - "{{ gogs_repo_path }}"
        - "{{ gogs_backup_archive }}"

    - name: Restore Gogs backup archive from Borg
      ansible.builtin.command:
        argv:
          - borg
          - extract
          - "{{ gogs_borg_repository }}::{{ gogs_restore_archive }}"
          - "{{ gogs_backup_archive | basename }}"
        chdir: "{{ gogs_backup_path }}"
      environment:
        BORG_UNKNOWN_UNENCRYPTED_REPO_ACCESS_IS_OK: "yes"

    - name: Set restored Gogs backup archive ownership
      ansible.builtin.file:
        path: "{{ gogs_backup_archive }}"
        state: file
        owner: git
        group: git
        mode: "0640"

    - name: Restore Gogs application state
      ansible.builtin.command:
        argv:
          - runuser
          - --user
          - git
          - --
          - "{{ gogs_install_path }}/gogs"
          - restore
          - --from
          - "{{ gogs_backup_archive }}"
