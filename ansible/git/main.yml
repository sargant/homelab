---
- name: Configure Gogs host
  hosts: git
  gather_facts: false

  vars:
    gogs_version: "0.14.3"

  pre_tasks:
    - name: Trust SSH host key
      ansible.builtin.include_tasks: "{{ common_dir }}/trust-host.yml"

    - name: Bootstrap Debian
      ansible.builtin.include_tasks: "{{ common_dir }}/bootstrap-debian.yml"

  tasks:
    - name: Install Gogs dependencies
      ansible.builtin.apt:
        name:
          - git
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create Git service user
      ansible.builtin.user:
        name: git
        home: /home/git
        create_home: true
        shell: /bin/bash
        system: true

    - name: Check whether Gogs is installed
      ansible.builtin.stat:
        path: /home/git/gogs/gogs
      register: gogs_binary

    - name: Install Gogs
      when: not gogs_binary.stat.exists
      block:
        - name: Create temporary Gogs archive
          ansible.builtin.tempfile:
            state: file
            suffix: .tar.gz
          register: gogs_archive

        - name: Download Gogs
          ansible.builtin.get_url:
            url: "https://github.com/gogs/gogs/releases/download/v{{ gogs_version }}/gogs_v{{ gogs_version }}_linux_amd64.tar.gz"
            dest: "{{ gogs_archive.path }}"
            checksum: sha256:c27fbd8337ebd661929389f5237bf601e09958d514835c99fad3b904c63bedb2
            mode: "0644"

        - name: Extract Gogs
          ansible.builtin.unarchive:
            src: "{{ gogs_archive.path }}"
            dest: /home/git
            remote_src: true
            owner: git
            group: git
          register: gogs_install

      always:
        - name: Remove temporary Gogs archive
          ansible.builtin.file:
            path: "{{ gogs_archive.path }}"
            state: absent
          when: gogs_archive.path is defined

    - name: Create Gogs configuration directory
      ansible.builtin.file:
        path: /home/git/gogs/custom/conf
        state: directory
        owner: git
        group: git
        mode: "0755"

    - name: Generate Gogs secret key
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import secrets, pathlib;
            pathlib.Path('/home/git/gogs/custom/conf/secret_key').write_text(secrets.token_urlsafe(32))
        creates: /home/git/gogs/custom/conf/secret_key

    - name: Secure Gogs secret key
      ansible.builtin.file:
        path: /home/git/gogs/custom/conf/secret_key
        state: file
        owner: git
        group: git
        mode: "0600"

    - name: Read Gogs secret key
      ansible.builtin.slurp:
        src: /home/git/gogs/custom/conf/secret_key
      register: gogs_secret_key_file

    - name: Set Gogs secret key
      ansible.builtin.set_fact:
        gogs_secret_key: "{{ gogs_secret_key_file.content | b64decode | trim }}"

    - name: Configure Gogs
      ansible.builtin.template:
        src: "{{ playbook_dir }}/assets/app.ini.j2"
        dest: /home/git/gogs/custom/conf/app.ini
        owner: git
        group: git
        mode: "0600"
      register: gogs_config

    - name: Configure Gogs service
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/assets/gogs.service"
        dest: /etc/systemd/system/gogs.service
        mode: "0644"
      register: gogs_service

    - name: Enable Gogs service
      ansible.builtin.systemd_service:
        name: gogs
        enabled: true
        daemon_reload: "{{ gogs_service.changed }}"
        state: "{{ 'restarted' if (gogs_install.changed | default(false)) or gogs_config.changed or gogs_service.changed else 'started' }}"

    - name: Wait for configured Gogs HTTP response
      ansible.builtin.uri:
        url: http://localhost:3000/
        method: GET
        follow_redirects: none
        status_code:
          - 200
          - 302
      register: gogs_http
      until:
        - gogs_http.status in [200, 302]
        - "'/install' not in (gogs_http.location | default(''))"
      retries: 12
      delay: 5
