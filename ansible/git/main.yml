---
- name: Configure Gogs host
  hosts: git
  gather_facts: false

  vars:
    gogs_version: "0.14.3"

  pre_tasks:
    - name: Trust SSH host key
      ansible.builtin.include_tasks: "{{ common_dir }}/trust-host.yml"

    - name: Bootstrap Debian
      ansible.builtin.include_tasks: "{{ common_dir }}/bootstrap-debian.yml"

  tasks:
    - name: Install Gogs dependencies
      ansible.builtin.apt:
        name:
          - git
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create Git service user
      ansible.builtin.user:
        name: git
        home: /home/git
        create_home: true
        shell: /bin/bash
        system: true

    - name: Check whether Gogs is installed
      ansible.builtin.stat:
        path: /home/git/gogs/gogs
      register: gogs_binary

    - name: Install Gogs
      when: not gogs_binary.stat.exists
      block:
        - name: Create temporary Gogs archive
          ansible.builtin.tempfile:
            state: file
            suffix: .tar.gz
          register: gogs_archive

        - name: Download Gogs
          ansible.builtin.get_url:
            url: "https://github.com/gogs/gogs/releases/download/v{{ gogs_version }}/gogs_v{{ gogs_version }}_linux_amd64.tar.gz"
            dest: "{{ gogs_archive.path }}"
            checksum: sha256:c27fbd8337ebd661929389f5237bf601e09958d514835c99fad3b904c63bedb2
            mode: "0644"

        - name: Extract Gogs
          ansible.builtin.unarchive:
            src: "{{ gogs_archive.path }}"
            dest: /home/git
            remote_src: true
            owner: git
            group: git
          register: gogs_install

      always:
        - name: Remove temporary Gogs archive
          ansible.builtin.file:
            path: "{{ gogs_archive.path }}"
            state: absent
          when: gogs_archive.path is defined

    - name: Configure Gogs service
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/assets/gogs.service"
        dest: /etc/systemd/system/gogs.service
        mode: "0644"
      register: gogs_service

    - name: Enable Gogs service
      ansible.builtin.systemd_service:
        name: gogs
        enabled: true
        daemon_reload: "{{ gogs_service.changed }}"
        state: "{{ 'restarted' if (gogs_install.changed | default(false)) or gogs_service.changed else 'started' }}"

    - name: Wait for Gogs HTTP response
      ansible.builtin.uri:
        url: http://localhost:3000/
        method: GET
        follow_redirects: none
        status_code:
          - 200
          - 302
      retries: 12
      delay: 5
