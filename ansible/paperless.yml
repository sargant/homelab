---
- name: Configure Paperless host
  hosts: paperless
  gather_facts: false

  vars:
    paperless_backup_source: "{{ hostvars['nas'].ansible_host }}:/volume1/backup/paperless"
    paperless_backup_mount: /mnt/backup
    paperless_install_path: /opt/paperless
    paperless_consume_path: "{{ paperless_install_path }}/consume"
    paperless_secrets_path: "{{ paperless_install_path }}/secrets"
    paperless_secret_key_path: "{{ paperless_secrets_path }}/paperless_secret_key"

  pre_tasks:
    - name: Trust SSH host key
      ansible.builtin.import_tasks: tasks/trust-host.yml

    - name: Bootstrap Debian
      ansible.builtin.import_tasks: tasks/bootstrap-debian.yml

    - name: Check hostname
      ansible.builtin.assert:
        that:
          - ansible_hostname == system_hostname
        fail_msg: >-
          Expected host {{ system_hostname }}, found {{ ansible_hostname }}.

  tasks:
    - name: Install Docker
      ansible.builtin.import_tasks: tasks/install-docker.yml

    - name: Configure Paperless backup NFS mount
      ansible.builtin.import_tasks: tasks/configure-nfs-mount.yml
      vars:
        nfs_source: "{{ paperless_backup_source }}"
        nfs_mountpoint: "{{ paperless_backup_mount }}"

    - name: Install Samba
      ansible.builtin.apt:
        name: samba
        state: present

    - name: Create Paperless consume directory
      ansible.builtin.file:
        path: "{{ paperless_consume_path }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0777"

    - name: Create Paperless secrets directory
      ansible.builtin.file:
        path: "{{ paperless_secrets_path }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Generate Paperless secret key
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import pathlib, secrets, sys;
            pathlib.Path(sys.argv[1]).write_text(secrets.token_urlsafe(64) + "\n")
          - "{{ paperless_secret_key_path }}"
        creates: "{{ paperless_secret_key_path }}"

    - name: Secure Paperless secret key
      ansible.builtin.file:
        path: "{{ paperless_secret_key_path }}"
        state: file
        owner: root
        group: root
        mode: "0600"

    - name: Install Paperless Compose definition
      ansible.builtin.copy:
        src: files/paperless/compose.yml
        dest: "{{ paperless_install_path }}/compose.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Configure Paperless Samba inbox
      ansible.builtin.template:
        src: files/paperless/smb.conf.j2
        dest: /etc/samba/smb.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart Samba

    - name: Validate Samba configuration
      ansible.builtin.command:
        argv:
          - testparm
          - -s
      register: paperless_samba_config_check
      changed_when: false

    - name: Enable and start Samba
      ansible.builtin.service:
        name: smbd
        enabled: true
        state: started

    - name: Apply Samba configuration
      ansible.builtin.meta: flush_handlers

    - name: Verify Samba is running
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - smbd
      register: paperless_samba_service_check
      changed_when: false

    - name: Check Samba service
      ansible.builtin.assert:
        that:
          - paperless_samba_service_check.stdout | trim == 'active'
        fail_msg: Samba is not active.

  handlers:
    - name: Restart Samba
      ansible.builtin.service:
        name: smbd
        state: restarted
